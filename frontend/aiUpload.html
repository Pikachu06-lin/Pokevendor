<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéVendor AI Card Upload</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>🎴 PokéVendor AI Card Upload</h1>

<div id="loginDiv">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email" value="">
  <input type="password" id="password" placeholder="Password" value="">
  <button id="loginBtn">Login</button>
  <div id="loginMsg"></div>
</div>

<div id="uploadForm">
  <h2>Upload Card Image for AI Identification</h2>
  <button class="logout-btn" id="logoutBtn">Logout</button>
  <div style="clear: both;"></div>

  <label for="cardImage">Image File:</label>
  <input type="file" id="cardImage" name="cardImage" accept="image/*" required>
  <img id="imagePreview" alt="Card preview">

  <input type="text" id="cardName" placeholder="Override card name (optional)">

  <!-- NOTE: language is now detected automatically by Gemini from the image.
       This dropdown is only used for manual name overrides. -->
  <label for="language">Card Language (manual override only):</label>
  <select id="language" name="language">
    <option value="Japanese">Japanese</option>
    <option value="English">English</option>
    <option value="French">French</option>
    <option value="German">German</option>
    <option value="Spanish">Spanish</option>
    <option value="Italian">Italian</option>
    <option value="Portuguese">Portuguese</option>
  </select>

  <label for="condition">Card Condition:</label>
  <select id="condition" name="condition">
    <option value="Near Mint">Near Mint</option>
    <option value="Lightly Played">Lightly Played</option>
    <option value="Moderately Played">Moderately Played</option>
    <option value="Heavily Played">Heavily Played</option>
    <option value="Damaged">Damaged</option>
  </select>

  <button id="uploadBtn">🔍 Identify &amp; Select Card</button>
  <div id="uploadMsg"></div>
</div>

<div id="cardSelection">
  <h3>Select the correct card and set your listed price:</h3>
  <ul id="cardList"></ul>
  <div class="pagination" id="pagination" style="display: none;">
    <button id="prevPage">← Previous</button>
    <span id="pageInfo">Page 1 of 1</span>
    <button id="nextPage">Next →</button>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
